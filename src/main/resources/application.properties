# ============================================================================
# Configuração do Servidor HTTP
# ============================================================================
server.port=${SERVER_PORT:8080}

# ============================================================================
# Configuração do Banco de Dados Transacional PostgreSQL
# ============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/clientesdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================================
# Configuração do Flyway (Migrations)
# ============================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ============================================================================
# Configuração do Hibernate / JPA
# ============================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================================
# Configuração de Serialização JSON
# ============================================================================
spring.jackson.serialization.indent_output=true
